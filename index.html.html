<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1인칭 3D 1:1 P2P 탄막 결투 게임 (아침 맵)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #38bdf8;
            background-color: #87ceeb;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 14px; height: 14px;
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: #0284c7; border: 1px solid #fff;
        }
        #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
        #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { font-size: 2.2rem; color: #38bdf8; margin-bottom: 8px; text-shadow: 0 0 12px rgba(56,189,248,0.5); }
        p { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 20px; text-align: center; max-width: 85%; }
        
        .btn-group { display: flex; gap: 12px; margin-bottom: 12px; }
        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white; border: none; padding: 12px 24px;
            font-size: 1rem; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-2px); background: linear-gradient(135deg, #0369a1, #1d4ed8); }
        .btn-secondary { background: #475569; }
        .btn-secondary:hover { background: #334155; }
        .btn-danger { background: linear-gradient(135deg, #e11d48, #be123c); }
        .btn-danger:hover { background: linear-gradient(135deg, #be123c, #9f1239); }
        
        .room-input {
            padding: 10px 16px; border-radius: 8px; border: 1px solid #475569;
            background: #0f172a; color: white; font-size: 1.1rem; width: 220px;
            text-align: center; margin-bottom: 12px; font-weight: bold; letter-spacing: 2px;
        }
        .status-msg { margin-top: 10px; font-size: 0.9rem; color: #f59e0b; font-weight: bold; }
        
        #hud {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 16px 24px; display: flex; justify-content: space-between;
            pointer-events: none; z-index: 5;
        }
        .player-status { display: flex; flex-direction: column; width: 250px; }
        .player-status.right { align-items: flex-end; }
        .player-name { font-weight: bold; font-size: 1rem; margin-bottom: 6px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .hp-bar-bg { width: 100%; height: 16px; background: rgba(15, 23, 42, 0.7); border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.3); }
        .hp-bar-fill { height: 100%; width: 100%; transition: width 0.15s ease-out; }
        .p1-color { color: #38bdf8; } .p1-bg { background: #0284c7; }
        .p2-color { color: #f43f5e; } .p2-bg { background: #e11d48; }
        
        .shield-status { margin-top: 6px; font-size: 0.85rem; color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 6px; }
        .shield-indicator { width: 10px; height: 10px; border-radius: 50%; }
        .shield-ready { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
        .shield-cooldown { background: #64748b; }

        #controls-guide {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85); padding: 8px 18px; border-radius: 20px;
            font-size: 0.82rem; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.2); pointer-events: none;
        }
        #pointer-lock-msg {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(245, 158, 11, 0.95); color: #000; font-weight: bold;
            padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; pointer-events: none; z-index: 6;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="crosshair" class="hidden"></div>
    <div id="pointer-lock-msg" class="hidden">화면을 클릭하여 시점 고정을 활성화하세요!</div>

    <!-- In-Game HUD -->
    <div id="hud" class="hidden">
        <div class="player-status left">
            <div id="p1-title" class="player-name p1-color">PLAYER 1 (YOU)</div>
            <div class="hp-bar-bg"><div id="p1-hp" class="hp-bar-fill p1-bg"></div></div>
            <div class="shield-status">
                <div id="p1-shield-ind" class="shield-indicator shield-ready"></div>
                <span id="p1-shield-text">방어막 [우클릭]: 준비 완료</span>
            </div>
        </div>
        <div class="player-status right">
            <div id="p2-title" class="player-name p2-color">PLAYER 2 (ENEMY)</div>
            <div class="hp-bar-bg"><div id="p2-hp" class="hp-bar-fill p2-bg"></div></div>
            <div class="shield-status">
                <span id="p2-shield-text">방어막: 준비 완료</span>
                <div id="p2-shield-ind" class="shield-indicator shield-ready"></div>
            </div>
        </div>
    </div>

    <div id="controls-guide" class="hidden">
        이동: [WASD] | 점프: [SPACE] | 사격: [좌클릭] | 방어막: [우클릭] | 대기실: [ESC]
    </div>

    <!-- Main Lobby -->
    <div id="lobby-screen" class="overlay">
        <h1>1인칭 3D 1:1 P2P 탄막 결투</h1>
        <p>화창한 아침 야외 경기장에서 펼쳐지는 1인칭 FPS 탄막 슈팅 대전입니다.</p>
        
        <div class="btn-group">
            <button id="sim-btn" class="btn">솔로 연습 모드 (AI 대전)</button>
        </div>
        
        <p style="margin-top: 10px; margin-bottom: 8px; font-size: 0.85rem; color: #94a3b8;">--- P2P 1:1 온라인 대전 ---</p>
        <div class="btn-group">
            <button id="create-btn" class="btn btn-secondary">방 만들기 (방장)</button>
        </div>
        <div style="display:flex; gap: 8px; align-items: center; margin-top: 4px;">
            <input type="text" id="room-code" class="room-input" placeholder="방 코드 4자리" maxlength="4">
            <button id="join-btn" class="btn btn-secondary" style="padding: 10px 16px;">방 참가하기</button>
        </div>
        <div id="status-msg" class="status-msg"></div>
    </div>

    <!-- Pause / Exit Confirm Overlay (ESC 메뉴) -->
    <div id="pause-screen" class="overlay hidden">
        <h1>일시 정지</h1>
        <p>게임 대기실로 돌아가시겠습니까?</p>
        <div class="btn-group">
            <button id="resume-btn" class="btn btn-secondary">계속 하기</button>
            <button id="exit-btn" class="btn btn-danger">대기실로 나가기</button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay hidden">
        <h1 id="winner-text">VICTORY!</h1>
        <p id="gameover-subtext">잠시 후 대기실로 이동합니다.</p>
        <div class="btn-group">
            <button id="to-lobby-btn" class="btn btn-secondary">대기실로 돌아가기</button>
        </div>
    </div>
</div>

<!-- Three.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- PeerJS WebRTC P2P Library -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
const container = document.getElementById('game-container');
const canvas = document.getElementById('gameCanvas');
const crosshair = document.getElementById('crosshair');
const pointerLockMsg = document.getElementById('pointer-lock-msg');

const lobbyScreen = document.getElementById('lobby-screen');
const pauseScreen = document.getElementById('pause-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const hud = document.getElementById('hud');
const controlsGuide = document.getElementById('controls-guide');

const simBtn = document.getElementById('sim-btn');
const createBtn = document.getElementById('create-btn');
const joinBtn = document.getElementById('join-btn');
const resumeBtn = document.getElementById('resume-btn');
const exitBtn = document.getElementById('exit-btn');
const toLobbyBtn = document.getElementById('to-lobby-btn');
const roomCodeInput = document.getElementById('room-code');
const statusMsg = document.getElementById('status-msg');
const winnerText = document.getElementById('winner-text');

const p1HpBar = document.getElementById('p1-hp');
const p2HpBar = document.getElementById('p2-hp');
const p1ShieldInd = document.getElementById('p1-shield-ind');
const p1ShieldText = document.getElementById('p1-shield-text');
const p1Title = document.getElementById('p1-title');
const p2Title = document.getElementById('p2-title');

let gameState = 'LOBBY'; 
let isSimulation = false;
let isHost = false;

// PeerJS Variables
let peer = null;
let conn = null;

// Three.js Engine Variables
let scene, camera, renderer;
let myGunMesh, myFPSShieldMesh;
let player1Obj, player2Obj;
let p1ShieldMesh, p2ShieldMesh;

let bullets = [];

// FPS Camera & Movement Physics State
let yaw = 0;   
let pitch = 0; 
const keys = {};

// 3D Player State
let player1 = { x: -15, y: 1.6, z: 0, vy: 0, isGrounded: true, hp: 100, maxHp: 100, isShieldActive: false, lastShieldTime: -7000, lastShotTime: 0 };
let player2 = { x: 15, y: 1.6, z: 0, vy: 0, isGrounded: true, hp: 100, maxHp: 100, isShieldActive: false, lastShieldTime: -7000, lastShotTime: 0 };

const FIRE_RATE = 500;        // 0.5초 연사 쿨타임
const SHIELD_COOLDOWN = 7000; // 7.0초 방어막 쿨타임
const SHIELD_DURATION = 1200; // 1.2초 무적
const GRAVITY = -0.015;
const JUMP_FORCE = 0.35;

// 우클릭 기본 컨텍스트 메뉴 방지 (방어키 사용)
window.addEventListener('contextmenu', e => e.preventDefault());

// 1. Three.js 3D 환경 구축 (화창한 아침 맵 연출)
function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7dd3fc); // 화창한 파란 하늘색
    scene.fog = new THREE.FogExp2(0xbae6fd, 0.012);

    camera = new THREE.PerspectiveCamera(75, 800 / 600, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(800, 600);
    renderer.shadowMap.enabled = true;

    // 밝은 아침 태양 조명 설정
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75); // 풍부한 주위 광원
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.2); // 직사 태양광
    sunLight.position.set(30, 50, 20);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // 잔디 & 그리드 아침 잔디 바닥 3D 맵
    const floorGeo = new THREE.PlaneGeometry(80, 80);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.8 }); // 밝은 초록색 잔디
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(80, 40, 0x0284c7, 0x22c55e);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // 경기장 밝은 하얀색 외곽 벽
    const wallGeo = new THREE.BoxGeometry(80, 6, 1);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5 });
    
    const wallN = new THREE.Mesh(wallGeo, wallMat); wallN.position.set(0, 3, -40); scene.add(wallN);
    const wallS = new THREE.Mesh(wallGeo, wallMat); wallS.position.set(0, 3, 40); scene.add(wallS);
    const wallE = new THREE.Mesh(wallGeo, wallMat); wallE.rotation.y = Math.PI/2; wallE.position.set(40, 3, 0); scene.add(wallE);
    const wallW = new THREE.Mesh(wallGeo, wallMat); wallW.rotation.y = Math.PI/2; wallW.position.set(-40, 3, 0); scene.add(wallW);

    // 상대방 3D 캐릭터 피규어
    player1Obj = createPlayerObject(0x0284c7);
    player2Obj = createPlayerObject(0xe11d48);
    scene.add(player1Obj);
    scene.add(player2Obj);

    // 상대방 3D 방어막 메시
    p1ShieldMesh = createShieldMesh(0x38bdf8);
    p2ShieldMesh = createShieldMesh(0xfb7185);
    player1Obj.add(p1ShieldMesh);
    player2Obj.add(p2ShieldMesh);

    // 1인칭 전용 총기 3D 메시 (카메라 자식)
    const gunGeo = new THREE.BoxGeometry(0.18, 0.18, 0.7);
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8, roughness: 0.2 });
    myGunMesh = new THREE.Mesh(gunGeo, gunMat);
    myGunMesh.position.set(0.32, -0.22, -0.55);
    camera.add(myGunMesh);

    // 1인칭 전용 3D 방어막 메시
    const fpsShieldGeo = new THREE.PlaneGeometry(1.6, 1.6);
    const fpsShieldMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
    myFPSShieldMesh = new THREE.Mesh(fpsShieldGeo, fpsShieldMat);
    myFPSShieldMesh.position.set(0, 0, -0.75);
    myFPSShieldMesh.visible = false;
    camera.add(myFPSShieldMesh);

    scene.add(camera);
}

function createPlayerObject(color) {
    const group = new THREE.Group();
    const bodyGeo = new THREE.SphereGeometry(1.2, 16, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.2;
    body.castShadow = true;
    group.add(body);
    return group;
}

function createShieldMesh(color) {
    const geo = new THREE.SphereGeometry(2.0, 16, 16);
    const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.35, wireframe: true });
    const shield = new THREE.Mesh(geo, mat);
    shield.position.y = 1.2;
    shield.visible = false;
    return shield;
}

// 2. Pointer Lock & Mouse/Keyboard Input
container.addEventListener('click', () => {
    if (gameState === 'PLAYING') {
        container.requestPointerLock();
    }
});

document.addEventListener('pointerlockchange', () => {
    if (document.pointerLockElement === container) {
        pointerLockMsg.classList.add('hidden');
    } else {
        if (gameState === 'PLAYING') pointerLockMsg.classList.remove('hidden');
    }
});

document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === container && gameState === 'PLAYING') {
        yaw -= e.movementX * 0.0025;
        pitch -= e.movementY * 0.0025;
        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
    }
});

// 마우스 클릭 이벤트 (좌클릭 = 총알 발사 / 우클릭 = 방어막 실행)
window.addEventListener('mousedown', (e) => {
    if (gameState !== 'PLAYING') return;

    const myPlayer = (isHost || isSimulation) ? player1 : player2;
    const now = Date.now();

    // 1) 좌클릭: 탄막 사격 (0.5초 쿨타임)
    if (e.button === 0) {
        if (now - myPlayer.lastShotTime >= FIRE_RATE) {
            myPlayer.lastShotTime = now;

            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            spawnBullet(myPlayer.x, myPlayer.y - 0.2, myPlayer.z, dir.x, dir.y, dir.z, isHost || isSimulation);

            // 총기 반동 반사
            myGunMesh.position.z = -0.38;
            setTimeout(() => { myGunMesh.position.z = -0.55; }, 90);

            if (conn && conn.open) {
                conn.send({
                    type: 'SHOOT',
                    x: myPlayer.x, y: myPlayer.y - 0.2, z: myPlayer.z,
                    dirX: dir.x, dirY: dir.y, dirZ: dir.z
                });
            }
        }
    }
    // 2) 우클릭: 방어막 실행 (7.0초 쿨타임)
    else if (e.button === 2) {
        if (now - myPlayer.lastShieldTime >= SHIELD_COOLDOWN) {
            myPlayer.isShieldActive = true;
            myPlayer.lastShieldTime = now;
            myFPSShieldMesh.visible = true;
            setTimeout(() => {
                myPlayer.isShieldActive = false;
                myFPSShieldMesh.visible = false;
            }, SHIELD_DURATION);
        }
    }
});

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();

    if (e.code === 'Escape') {
        if (gameState === 'PLAYING') {
            gameState = 'PAUSED';
            pauseScreen.classList.remove('hidden');
            document.exitPointerLock();
        } else if (gameState === 'PAUSED') {
            gameState = 'PLAYING';
            pauseScreen.classList.add('hidden');
            container.requestPointerLock();
        } else if (gameState === 'GAMEOVER') {
            returnToLobby();
        }
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// 3. P2P 네트워크 (PeerJS)
const PREFIX = "MORNING3D2026_";

createBtn.addEventListener('click', () => {
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    statusMsg.innerText = `방 생성 중... (코드: ${code})`;
    
    if (peer) peer.destroy();
    peer = new Peer(PREFIX + code);

    peer.on('open', () => {
        statusMsg.innerText = `[방 생성 완료] 친구에게 코드 [ ${code} ] 를 알려주세요. 접속 대기 중...`;
        isHost = true;
        isSimulation = false;
    });

    peer.on('connection', (connection) => {
        conn = connection;
        setupP2PConnection();
        startMatch();
    });
});

joinBtn.addEventListener('click', () => {
    const code = roomCodeInput.value.trim();
    if (code.length !== 4) {
        statusMsg.innerText = "4자리 방 코드를 정확히 입력해주세요.";
        return;
    }

    statusMsg.innerText = `방 [${code}] 접속 시도 중...`;
    
    if (peer) peer.destroy();
    peer = new Peer();

    peer.on('open', () => {
        conn = peer.connect(PREFIX + code);
        isHost = false;
        isSimulation = false;
        setupP2PConnection();
    });
});

function setupP2PConnection() {
    conn.on('open', () => {
        statusMsg.innerText = "상대방과 성공적으로 연결되었습니다!";
        setTimeout(() => { startMatch(); }, 800);
    });

    conn.on('data', (data) => {
        if (data.type === 'POS_UPDATE') {
            const targetPlayer = isHost ? player2 : player1;
            targetPlayer.x = data.x;
            targetPlayer.y = data.y;
            targetPlayer.z = data.z;
            targetPlayer.isShieldActive = data.isShieldActive;
        } else if (data.type === 'SHOOT') {
            spawnBullet(data.x, data.y, data.z, data.dirX, data.dirY, data.dirZ, !isHost);
        } else if (data.type === 'DISCONNECT') {
            alert("상대방의 연결이 끊어졌습니다.");
            returnToLobby();
        }
    });
}

simBtn.addEventListener('click', () => { isSimulation = true; isHost = true; startMatch(); });
resumeBtn.addEventListener('click', () => { gameState = 'PLAYING'; pauseScreen.classList.add('hidden'); container.requestPointerLock(); });
exitBtn.addEventListener('click', () => { returnToLobby(); });
toLobbyBtn.addEventListener('click', () => { returnToLobby(); });

function returnToLobby() {
    if (document.pointerLockElement) document.exitPointerLock();
    if (conn) { try { conn.send({ type: 'DISCONNECT' }); } catch(e){} conn.close(); }
    if (peer) peer.destroy();

    gameState = 'LOBBY';
    pauseScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    hud.classList.add('hidden');
    crosshair.classList.add('hidden');
    controlsGuide.classList.add('hidden');
    pointerLockMsg.classList.add('hidden');
    lobbyScreen.classList.remove('hidden');

    bullets.forEach(b => scene.remove(b.mesh));
    bullets = [];
    player1 = { x: -15, y: 1.6, z: 0, vy: 0, isGrounded: true, hp: 100, maxHp: 100, isShieldActive: false, lastShieldTime: -7000, lastShotTime: 0 };
    player2 = { x: 15, y: 1.6, z: 0, vy: 0, isGrounded: true, hp: 100, maxHp: 100, isShieldActive: false, lastShieldTime: -7000, lastShotTime: 0 };
}

function startMatch() {
    lobbyScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    
    hud.classList.remove('hidden');
    crosshair.classList.remove('hidden');
    controlsGuide.classList.remove('hidden');

    player1.hp = 100; player2.hp = 100;
    yaw = isHost ? -Math.PI / 2 : Math.PI / 2;
    pitch = 0;

    gameState = 'PLAYING';
    container.requestPointerLock();
}

// 4. 탄막 생성 (단발 플라즈마 구체)
function spawnBullet(x, y, z, dirX, dirY, dirZ, isP1) {
    const geo = new THREE.SphereGeometry(0.35, 12, 12);
    const mat = new THREE.MeshStandardMaterial({ 
        color: isP1 ? 0x0284c7 : 0xe11d48, 
        emissive: isP1 ? 0x38bdf8 : 0xfb7185,
        emissiveIntensity: 0.8
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    scene.add(mesh);

    bullets.push({
        mesh: mesh,
        dir: new THREE.Vector3(dirX, dirY, dirZ).normalize(),
        speed: 0.85,
        isP1: isP1,
        damage: 10
    });
}

// 5. FPS Physics & Game Loop
function updateFPS() {
    if (gameState !== 'PLAYING') return;

    const myPlayer = (isHost || isSimulation) ? player1 : player2;

    camera.rotation.order = 'YXZ';
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    // WASD 이동
    const moveSpeed = 0.22;
    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
    const side = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();

    if (keys['KeyW'] || keys['ArrowUp']) { myPlayer.x += forward.x * moveSpeed; myPlayer.z += forward.z * moveSpeed; }
    if (keys['KeyS'] || keys['ArrowDown']) { myPlayer.x -= forward.x * moveSpeed; myPlayer.z -= forward.z * moveSpeed; }
    if (keys['KeyA'] || keys['ArrowLeft']) { myPlayer.x -= side.x * moveSpeed; myPlayer.z -= side.z * moveSpeed; }
    if (keys['KeyD'] || keys['ArrowRight']) { myPlayer.x += side.x * moveSpeed; myPlayer.z += side.z * moveSpeed; }

    // 스페이스바 점프 물리 적용
    if (keys['Space'] && myPlayer.isGrounded) {
        myPlayer.vy = JUMP_FORCE;
        myPlayer.isGrounded = false;
    }

    // 중력 가속도
    myPlayer.vy += GRAVITY;
    myPlayer.y += myPlayer.vy;

    // 착지 수평면 검사
    if (myPlayer.y <= 1.6) {
        myPlayer.y = 1.6;
        myPlayer.vy = 0;
        myPlayer.isGrounded = true;
    }

    // 맵 외곽 경계
    myPlayer.x = Math.max(-38, Math.min(38, myPlayer.x));
    myPlayer.z = Math.max(-38, Math.min(38, myPlayer.z));

    camera.position.set(myPlayer.x, myPlayer.y, myPlayer.z);

    // P2P 위치 및 방어막 상태 공유
    if (conn && conn.open) {
        conn.send({
            type: 'POS_UPDATE',
            x: myPlayer.x, y: myPlayer.y, z: myPlayer.z,
            isShieldActive: myPlayer.isShieldActive
        });
    }

    // AI 조작 (연습 모드)
    const now = Date.now();
    if (isSimulation) {
        player2.z += Math.sin(now / 400) * 0.18;
        if (now - player2.lastShotTime >= 1200) {
            player2.lastShotTime = now;
            const dir = new THREE.Vector3(player1.x - player2.x, player1.y - player2.y, player1.z - player2.z).normalize();
            spawnBullet(player2.x, player2.y, player2.z, dir.x, dir.y, dir.z, false);
        }
    }

    // 탄막 피격 및 충돌 물리
    bullets.forEach((b, idx) => {
        b.mesh.position.addScaledVector(b.dir, b.speed);

        const target = b.isP1 ? player2 : player1;
        const dist = b.mesh.position.distanceTo(new THREE.Vector3(target.x, target.y, target.z));

        // 방어막 디플렉트
        if (target.isShieldActive && dist < 2.5) {
            scene.remove(b.mesh);
            bullets.splice(idx, 1);
            return;
        }

        // 직격
        if (dist < 1.4) {
            scene.remove(b.mesh);
            bullets.splice(idx, 1);
            target.hp = Math.max(0, target.hp - b.damage);

            if (target.hp <= 0 && gameState === 'PLAYING') {
                gameState = 'GAMEOVER';
                document.exitPointerLock();
                showGameOver();
            }
        }
    });

    // 3D 모델 트랜스폼 반영
    player1Obj.position.set(player1.x, player1.y - 1.6, player1.z);
    player2Obj.position.set(player2.x, player2.y - 1.6, player2.z);
    
    p1ShieldMesh.visible = player1.isShieldActive;
    p2ShieldMesh.visible = player2.isShieldActive;

    player1Obj.visible = !isHost && !isSimulation;
    player2Obj.visible = isHost || isSimulation;
}

function updateHUD() {
    p1HpBar.style.width = `${(player1.hp / player1.maxHp) * 100}%`;
    p2HpBar.style.width = `${(player2.hp / player2.maxHp) * 100}%`;

    const myPlayer = (isHost || isSimulation) ? player1 : player2;
    const now = Date.now();
    const shieldCD = Math.max(0, SHIELD_COOLDOWN - (now - myPlayer.lastShieldTime));

    if (shieldCD === 0) {
        p1ShieldInd.className = "shield-indicator shield-ready";
        p1ShieldText.innerText = "방어막 [우클릭]: 준비 완료";
    } else {
        p1ShieldInd.className = "shield-indicator shield-cooldown";
        p1ShieldText.innerText = `방어막 쿨타임: ${(shieldCD / 1000).toFixed(1)}s`;
    }
}

function showGameOver() {
    gameoverScreen.classList.remove('hidden');
    const myPlayer = (isHost || isSimulation) ? player1 : player2;

    if (myPlayer.hp > 0) {
        winnerText.innerText = "VICTORY! (승리)";
        winnerText.className = "p1-color";
    } else {
        winnerText.innerText = "DEFEAT... (패배)";
        winnerText.className = "p2-color";
    }
}

function animate() {
    requestAnimationFrame(animate);
    updateFPS();
    updateHUD();
    if (renderer && scene && camera) renderer.render(scene, camera);
}

init3D();
animate();
</script>
